name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Backend regression checks
        run: uv run --python 3.13 python -m unittest discover -s tests -v
      - name: Build and validate portable app
        run: uv run --python 3.13 python install.py --package build/SessionPier-ci.zip
